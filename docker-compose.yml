# Atheera: the whole project in one container.
#
#   docker compose up --build
#   then open http://localhost:8010
#
# The image is built in two stages, written inline below so this one file is enough:
#   1. dashboard: Node builds the Next.js dashboard into static files.
#   2. runtime:   a slim Python image runs the FastAPI backend, which also serves those static files.
#
# It runs the demo: the backend replays the recordings in results/tracks, so no dataset, no model
# weights and no GPU are needed (and PyTorch is not installed, which keeps the image small).
# Rebuilding the tracks or retraining the models is done on your own machine, see the README.
#
# Optional: export ANTHROPIC_API_KEY (or put it in a .env file next to this one) and Claude writes the
# handover brief. Without it a template writes it. Needs Docker Compose 2.17 or newer.

name: atheera

services:
  atheera:
    image: atheera:latest
    build:
      context: .
      dockerfile_inline: |
        # ---------- stage 1: build the dashboard ----------
        FROM node:22-bookworm-slim AS dashboard
        WORKDIR /build/dashboard
        COPY dashboard/package.json dashboard/package-lock.json ./
        RUN npm ci --no-audit --no-fund
        COPY dashboard/ ./
        # next build fetches the font once at build time, so this step needs internet access
        RUN npm run build

        # ---------- stage 2: the backend that also serves the dashboard ----------
        FROM python:3.12-slim AS runtime
        ENV PYTHONUNBUFFERED=1 \
            PYTHONDONTWRITEBYTECODE=1 \
            PYTHONPATH=/app \
            PIP_NO_CACHE_DIR=1 \
            PIP_DISABLE_PIP_VERSION_CHECK=1
        WORKDIR /app
        # Only what the server imports. uvicorn[standard] brings the WebSocket support the dashboard needs;
        # anthropic is optional and only used when ANTHROPIC_API_KEY is set.
        RUN pip install numpy scipy pyyaml fastapi "uvicorn[standard]" anthropic
        COPY atheer/ atheer/
        COPY scenarios/ scenarios/
        COPY results/ results/
        COPY --from=dashboard /build/dashboard/dist dashboard/dist
        RUN useradd --system --uid 10001 --no-create-home atheera
        USER atheera
        EXPOSE 8010
        # One worker on purpose: the replay and the alert log live in this process's memory.
        CMD ["uvicorn", "atheer.api.main:app", "--host", "0.0.0.0", "--port", "8010", "--log-level", "warning"]
    ports:
      - "8010:8010"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/state', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
